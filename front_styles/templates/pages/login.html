{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17100c">
    <title>Login | Meu Front</title>
    <link rel="stylesheet" href="{% static 'css/pages/login.css' %}">
</head>
<body>
    <main class="login-page">
        <div class="glow glow--top" aria-hidden="true"></div>
        <div class="glow glow--bottom" aria-hidden="true"></div>

        <section class="login-card" aria-labelledby="login-title">
            <header class="login-header">
                <h1 id="login-title">Bem-vindo</h1>
                <p>Entre com seus dados para continuar.</p>
            </header>

            <form class="login-form" method="post" action="{% url 'login' %}">
                {% csrf_token %}

                <div class="form-field">
                    <div class="field-control">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <circle cx="12" cy="8" r="4" />
                            <path d="M4.5 20c.7-4 3.2-6 7.5-6s6.8 2 7.5 6" />
                        </svg>
                        <input
                            id="username"
                            name="username"
                            type="text"
                            placeholder=" "
                            value="{{ username|default:'' }}"
                            autocomplete="username"
                            required
                        >
                        <label class="field-label" for="username">Login</label>
                    </div>
                </div>

                <div class="form-field">
                    <div class="field-control">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <rect x="5" y="10" width="14" height="10" rx="2" />
                            <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14.5v2" />
                        </svg>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder=" "
                            autocomplete="current-password"
                            required
                        >
                        <label class="field-label" for="password">Senha</label>
                        <button
                            class="password-toggle"
                            type="button"
                            aria-label="Mostrar senha"
                            aria-pressed="false"
                            title="Mostrar senha"
                        >
                            <svg class="eye-icon eye-icon--open" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
                                <circle cx="12" cy="12" r="2.5" />
                            </svg>
                            <svg class="eye-icon eye-icon--closed" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="m4 4 16 16M10.5 6.2c.5-.1 1-.2 1.5-.2 6 0 9.5 6 9.5 6a18 18 0 0 1-2.1 2.8M6.3 7.1C3.9 8.8 2.5 12 2.5 12s3.5 6 9.5 6c1.4 0 2.7-.3 3.8-.8M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                            </svg>
                        </button>
                    </div>
                </div>

                {% if error_message %}
                    <p class="login-error" role="alert">{{ error_message }}</p>
                {% endif %}

                <div class="login-actions">
                    <label class="remember-option" for="remember-me">
                        <input
                            id="remember-me"
                            name="remember_me"
                            type="checkbox"
                            {% if remember_me %}checked{% endif %}
                        >
                        <span>Lembra de mim</span>
                    </label>

                    <button class="login-button" type="submit">
                        <span class="button-label">Entrar</span>
                        <span class="button-loader" aria-hidden="true"></span>
                        <svg class="button-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M5 12h14M14 7l5 5-5 5" />
                        </svg>
                    </button>
                </div>
            </form>

        </section>
    </main>

    <script src="{% static 'js/pages/login.js' %}" defer></script>
</body>
</html>
